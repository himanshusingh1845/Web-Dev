<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 2 </title>
    <style>
        table{
    border-collapse: collapse;
}
td{
    text-align: center;
    padding: 5px;
    border: 1px solid black;
    background-color: lightblue;
}
    </style>
</head>
<body>
    <table>
<tr>
<th colspan="5">Weekly Class Time Table </th>
</tr>
<tr>
    <td colspan="1">Time Table</td>
    <td>10AM -12AM</td>
    <td>12-2PM</td>
    <td colspan="1">2-3PM</td>
    <td>3-5PM</td>
</tr>
<tr> 
    <td>MONDAY</td>
    <td colspan="2">Python</td>
    <td rowspan="5">LunchBreak</td>
    <td>SQL</td>
</tr>
<tr>
    <td>Tuesday</td>
    <td>Web</td>
    <td>Python</td>
    <td>Django</td>
</tr>
<tr>
    <td rowspan="2"> Wednesday and Thursday </td>
    <td> Web </td>
    <td>SQL</td>
    <td>Python </td>
</tr>
<tr>
    <td>Django</td>
    <td>SQL</td>
    <td>Web</td>
</tr>
<tr> 
    <td>Friday</td>
    <td colspan="2">Web Development</td>
    <td>Python</td>
</tr>





    </table>









</body>
</html>
